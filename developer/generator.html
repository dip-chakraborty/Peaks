<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peaks Icon Rasterizer</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #07080e;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 600px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    h1 {
      color: #c084fc;
      margin-bottom: 10px;
      font-weight: 600;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .icon-grid {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 30px;
      margin-bottom: 40px;
    }
    .icon-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-label {
      font-size: 12px;
      color: #a78bfa;
      margin-top: 15px;
      font-weight: 500;
    }
    .download-btn {
      background: linear-gradient(135deg, #a78bfa, #c084fc);
      color: #07080e;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px 0 rgba(167, 139, 250, 0.4);
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(167, 139, 250, 0.6);
    }
    .download-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Peaks Icon Rasterizer</h1>
    <p>
      Microsoft Edge and Google Chrome require extension toolbar icons to be in <strong>PNG</strong> format. 
      This tool uses your browser's canvas engine to perfectly rasterize the original <code>icon.svg</code> into high-fidelity PNG icons.
    </p>

    <div class="icon-grid">
      <div class="icon-card">
        <canvas id="canvas-128" width="128" height="128"></canvas>
        <span class="icon-label">128 x 128</span>
      </div>
      <div class="icon-card">
        <canvas id="canvas-48" width="48" height="48"></canvas>
        <span class="icon-label">48 x 48</span>
      </div>
      <div class="icon-card">
        <canvas id="canvas-16" width="16" height="16"></canvas>
        <span class="icon-label">16 x 16</span>
      </div>
    </div>

    <button class="download-btn" id="download-all-btn">Download PNG Icons</button>
  </div>

  <script src="generator.js"></script>
</body>
</html>
