<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peaks</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="eq-container">
    <!-- Header Section -->
    <header class="eq-header">
      <div class="brand">
        <div class="brand-logo">
          <span class="logo-dot"></span>
          <span class="logo-pulse"></span>
        </div>
        <h1>PEAKS</h1>
      </div>
      <div class="controls-group">
        <!-- Custom Preset Dropdown -->
        <div class="custom-dropdown" id="preset-dropdown">
          <button class="dropdown-trigger" id="dropdown-trigger" title="Select Preset">
            <span id="selected-preset-name">Flat (Default)</span>
            <svg class="dropdown-arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="dropdown-menu hidden" id="dropdown-menu">
            <!-- Dynamically populated in groups -->
          </div>
        </div>

        <!-- Save Custom Preset Button -->
        <button id="save-preset-btn" class="icon-btn" title="Save Custom Preset" aria-label="Save Custom Preset">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Delete Custom Preset Button -->
        <button id="delete-preset-btn" class="icon-btn delete-btn hidden" title="Delete Custom Preset" aria-label="Delete Custom Preset">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="3 6 5 6 21 6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="10" y1="11" x2="10" y2="17" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="14" y1="11" x2="14" y2="17" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Master Power Toggle -->
        <button id="master-toggle" class="power-btn" aria-label="Toggle Equalizer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="power-status-text">OFF</span>
        </button>
      </div>
    </header>

    <!-- Save Preset Overlay Modal -->
    <div id="save-preset-modal" class="preset-modal hidden">
      <div class="preset-modal-content">
        <h3>SAVE PRESET</h3>
        <input type="text" id="preset-name-input" placeholder="Preset name..." maxlength="18">
        <div class="preset-modal-actions">
          <button id="cancel-save-btn" class="text-btn">CANCEL</button>
          <button id="confirm-save-btn" class="action-btn">SAVE</button>
        </div>
      </div>
    </div>

    <!-- Overwrite Confirmation Modal -->
    <div id="overwrite-modal" class="preset-modal hidden">
      <div class="preset-modal-content">
        <h3>PRESET EXISTS</h3>
        <p class="overwrite-msg">A preset named &ldquo;<span id="overwrite-name-label"></span>&rdquo; already exists. Overwrite it?</p>
        <div class="preset-modal-actions">
          <button id="overwrite-no-btn" class="text-btn">NO, GO BACK</button>
          <button id="overwrite-yes-btn" class="action-btn">YES, OVERWRITE</button>
        </div>
      </div>
    </div>


    <!-- Combined Curve Visualizer & EQ Sliders -->
    <section class="visualizer-container">
      <canvas id="response-curve" width="498" height="195"></canvas>
      <main class="eq-sliders-row" id="sliders-row">
        <!-- 11 vertical sliders will be dynamically generated by JS -->
      </main>
      <div class="visualizer-labels">
        <span>20Hz</span>
        <span>100Hz</span>
        <span>1kHz</span>
        <span>10kHz</span>
        <span>20kHz</span>
      </div>
    </section>

    <!-- Tabbed Dials Section -->
    <section class="dials-section">
      <div class="dial-tabs">
        <button class="dial-tab-btn active" data-tab="tone">EQ & Filter</button>
        <button class="dial-tab-btn" data-tab="dynamics">Dynamics</button>
        <button class="dial-tab-btn" data-tab="spatial">Space & Pan</button>
      </div>
      <section class="eq-dials-row" id="dials-row">
        <!-- Rotary dials will be dynamically generated by JS based on active tab -->
      </section>
    </section>

    <!-- Footer Controls -->
    <footer class="eq-footer">
      <button id="reset-btn" class="text-btn">Reset All</button>
      <a class="tip-text credit-link" href="https://github.com/dip-chakraborty" target="_blank" rel="noopener noreferrer">vibed by &mdash; github.com/dip-chakraborty</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
